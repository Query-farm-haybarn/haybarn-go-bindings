name: Tests
on:
  push:
    branches:
      - haybarn
      - "haybarn-[0-9]*"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.head_ref || '' }}-${{ github.base_ref || '' }}-${{ github.sha }}
  cancel-in-progress: true

jobs:
  go-tests:
    name: Test Pre-Built Libs
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    strategy:
      matrix:
        include:
          # windows-amd64 needs a MinGW static-libs archive, which the Haybarn
          # engine release doesn't build yet.
          - &darwin-amd64 { platform: darwin-amd64, runner: macos-15-intel }
          - &darwin-arm64 { platform: darwin-arm64, runner: macos-26 }
          - &linux-amd64 { platform: linux-amd64, runner: ubuntu-24.04 }
          - &linux-arm64 { platform: linux-arm64, runner: ubuntu-24.04-arm }
      fail-fast: false
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      # Until the pinned native modules are published at the origin, package
      # them from the pinned release archives and test through a local module
      # proxy (same bytes and go.sum hashes as the published modules).
      - name: Test ${{ matrix.platform }}
        run: |
          info="$(jq -r .origin duckdb-release.json)/modules/$(jq -r '.origin | sub("^https://"; "")' duckdb-release.json)/libhaybarn/${{ matrix.platform }}/@v/$(jq -r .version duckdb-release.json).info"
          if curl -fsS -o /dev/null "$info"; then
            make test
          else
            echo "::notice::$info is not published; testing the packaged modules"
            make test.packaged
          fi

  dynamic-lib-tests:
    name: Test Dynamic Libs
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    strategy:
      matrix:
        include:
          - *darwin-amd64
          - *darwin-arm64
          - *linux-amd64
          - *linux-arm64
      fail-fast: false
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Test ${{ matrix.platform }}
        run: make test.dynamic

  static-lib-tests:
    name: Test Static Libs
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    strategy:
      matrix:
        include:
          - *darwin-amd64
          - *darwin-arm64
          - *linux-amd64
          - *linux-arm64
      fail-fast: false
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Test ${{ matrix.platform }}
        run: make test.static
