# Re-vendors the pre-built engine static libraries from a Haybarn engine
# release into lib/<platform>/. Bump HAYBARN_VERSION in the Makefile first.
name: Fetch and Push Libs
on:
  workflow_dispatch:
jobs:
  fetch-libs:
    runs-on: ubuntu-latest
    # The Commit step pushes the refreshed lib/<platform>/*.a back to this
    # branch, which the ambient GITHUB_TOKEN cannot do at the default
    # (read-only) contents permission — it fails with a 403 from
    # github-actions[bot] after having already built the commit locally.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
      - name: Fetch Darwin
        run: |
          make fetch.static.libs PLATFORM=darwin-arm64 FILENAME=static-libs-osx-arm64 COPY_HEADER=1
          make fetch.static.libs PLATFORM=darwin-amd64 FILENAME=static-libs-osx-amd64
        shell: bash
      - name: Fetch Linux
        run: |
          make fetch.static.libs PLATFORM=linux-amd64 FILENAME=static-libs-linux-amd64
          make fetch.static.libs PLATFORM=linux-arm64 FILENAME=static-libs-linux-arm64
        shell: bash
      - name: Fetch Windows
        run: |
          make fetch.static.libs PLATFORM=windows-amd64 FILENAME=static-libs-windows-mingw
        shell: bash
      - name: Commit
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: push libs
